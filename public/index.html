<title>حَسبة Hasba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: sticky header, one-column-to-two hero with the Payday Strip, app shell with start-side sidebar (bottom tab bar on phones). Tokens follow DESIGN.md. */
:root{
  --bg:#F2F5F4;--surface:#FFFFFF;--ink:#14252B;--muted:#56686D;--line:#D8E0DE;
  --teal:#0F4C45;--teal-2:#E0EDEA;--gold:#9A6508;--gold-2:#FBF0D9;--rose:#AE3530;--rose-2:#FBE6E4;
  --green:#2B7555;--green-2:#E2F2EA;--wa:#DCF8C6;--on-teal:#F2F5F4;
  --c1:#0F4C45;--c2:#9A6508;--c3:#AE3530;--c4:#2B7555;--c5:#3E5C9A;--c6:#7A4A8C;--c7:#4F6B72;--c8:#8C5A2B;
  --font-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --font-body:"IBM Plex Sans Arabic","IBM Plex Sans",Tahoma,"Segoe UI",system-ui,sans-serif;
  --shadow:0 8px 24px rgba(20,37,43,.16);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1B1E;--surface:#16262A;--ink:#E4EDEB;--muted:#9BB0AD;--line:#26393D;
  --teal:#63C4B4;--teal-2:#173936;--gold:#E3B04B;--gold-2:#3A2D13;--rose:#F08A83;--rose-2:#3D201E;
  --green:#6FCF9F;--green-2:#17352A;--wa:#1F3B2C;--on-teal:#0F1B1E;
  --c1:#63C4B4;--c2:#E3B04B;--c3:#F08A83;--c4:#6FCF9F;--c5:#8FA9E0;--c6:#C39AD3;--c7:#8FB0B8;--c8:#D3A06A;
  --shadow:0 8px 24px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1B1E;--surface:#16262A;--ink:#E4EDEB;--muted:#9BB0AD;--line:#26393D;
  --teal:#63C4B4;--teal-2:#173936;--gold:#E3B04B;--gold-2:#3A2D13;--rose:#F08A83;--rose-2:#3D201E;
  --green:#6FCF9F;--green-2:#17352A;--wa:#1F3B2C;--on-teal:#0F1B1E;
  --c1:#63C4B4;--c2:#E3B04B;--c3:#F08A83;--c4:#6FCF9F;--c5:#8FA9E0;--c6:#C39AD3;--c7:#8FB0B8;--c8:#D3A06A;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.65;padding-inline:0}
:lang(en) body,body[lang=en]{font-family:"IBM Plex Sans","IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}

.wrap{max-width:1120px;margin-inline:auto;padding-inline:16px}

.disp{font-family:var(--font-display);font-weight:700}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}

.btn.danger{color:var(--rose)}

.btn.icon{min-width:44px;padding:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir=rtl] .flip{transform:scaleX(-1)}
/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid transparent}
.hdr.scrolled{border-color:var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:16px;min-height:64px}
.logo{font-family:var(--font-display);font-weight:700;font-size:1.75rem;color:var(--teal);text-decoration:none;line-height:1;background:none;border:0;cursor:pointer;padding:0}
.nav{display:none;gap:4px;margin-inline:auto}
.nav a{padding:8px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--teal-2)}
.hdr .end{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
.hdr .nav+.end{margin-inline-start:0}
.hide-s{display:none}

.sheet{border-top:1px solid var(--line);background:var(--surface)}

.sheet a{padding:12px 4px;text-decoration:none;color:var(--ink);font-weight:500;border-bottom:1px solid var(--line)}
/* hero */
.hero{display:grid;gap:40px;padding-block:40px 56px;align-items:center}
@media(min-width:900px){.hero{grid-template-columns:1fr 1.15fr;padding-block:56px 80px}}
.hero h1{font-family:var(--font-display);font-weight:700;font-size:clamp(2.5rem,6vw,4rem);line-height:1.1;text-wrap:balance}
.hero p.sub{color:var(--muted);max-width:52ch;margin-block:20px 24px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.trust{margin-top:20px;color:var(--muted)}
.hero-vis{position:relative;padding-bottom:56px;min-width:0}
.tag{position:absolute;top:-12px;inset-inline-end:16px;background:var(--gold-2);color:var(--gold);border-radius:999px;padding:2px 12px;font-size:.78rem;font-weight:600;z-index:2;border:1px solid var(--gold)}
/* payday strip */
.strip{background:var(--teal);color:var(--on-teal);border-radius:22px;padding:24px;position:relative;min-width:0}
.strip .lead{opacity:.92}
.strip .big{font-family:var(--font-display);font-weight:700;font-size:clamp(2.5rem,6vw,4rem);line-height:1.1;margin-block:4px 8px;display:block}
.rail{position:relative;height:56px;margin-block:20px 8px;margin-inline:12px}
.rail::before{content:"";position:absolute;inset-inline:0;top:26px;height:4px;border-radius:4px;background:color-mix(in srgb,var(--on-teal) 30%,transparent)}
.pin{position:absolute;top:14px;width:28px;height:28px;margin-inline-start:-14px;border-radius:50%;border:2px solid var(--teal);background:var(--on-teal);cursor:pointer;padding:0;display:grid;place-items:center;font-size:.7rem;font-weight:700;color:var(--teal)}
.pin.trial{background:var(--rose-2);color:var(--rose)}
.pin .tip{position:absolute;bottom:34px;inset-inline-start:50%;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:var(--bg);padding:4px 10px;border-radius:8px;font-size:.78rem;box-shadow:var(--shadow);display:none;z-index:3;font-weight:500}
[dir=rtl] .pin .tip{transform:translateX(50%)}
.pin:hover .tip,.pin:focus-visible .tip{display:block}
.rail-ends{display:flex;justify-content:space-between;font-size:.875rem;opacity:.9;margin-inline:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid color-mix(in srgb,var(--on-teal) 30%,transparent)}
.stats b{display:block;font-family:var(--font-display);font-size:1.3rem}
@media(prefers-reduced-motion:no-preference){.pin{animation:pop .3s ease-out both;animation-delay:calc(var(--i)*40ms)}@keyframes pop{from{opacity:0;transform:scale(.4)}}}
.wa{position:absolute;bottom:0;inset-inline-start:16px;max-width:min(88%,360px);background:var(--wa);color:var(--ink);padding:10px 14px;border-radius:14px;box-shadow:var(--shadow);font-size:.9rem;z-index:2}
.wa .lab{display:block;color:var(--muted);font-size:.72rem;margin-bottom:2px}
/* sections */
section.s{padding-block:56px}
section.s h2{font-size:1.75rem;line-height:1.3;margin-bottom:8px;font-family:var(--font-display);text-wrap:balance}
section.s .intro{color:var(--muted);max-width:60ch;margin-bottom:32px}
.steps{display:grid;gap:16px}
@media(min-width:820px){.steps{grid-template-columns:repeat(3,1fr)}}
.step{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.step .n{font-family:var(--font-display);font-size:2rem;color:var(--teal);line-height:1}
.step h3{margin-block:8px 4px;font-size:1.06rem}
.feat{display:grid;gap:24px;align-items:center;padding-block:24px;border-top:1px solid var(--line)}
@media(min-width:820px){.feat{grid-template-columns:1fr 1fr;gap:56px}.feat.alt .fv{order:-1}}
.feat h3{font-size:1.3rem;margin-bottom:8px}
.fv{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.priv{background:var(--teal-2);border-radius:22px;padding:32px;display:grid;gap:16px}
@media(min-width:820px){.priv{grid-template-columns:repeat(3,1fr)}}
.priv h3{display:flex;gap:8px;align-items:center;font-size:1.06rem;color:var(--teal)}
details.faq{border-bottom:1px solid var(--line);padding-block:4px}
details.faq summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600;list-style:none;gap:8px}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:"+";margin-inline-start:auto;color:var(--teal);font-size:1.3rem}
details.faq[open] summary::after{content:"–"}
details.faq p{padding-bottom:12px;color:var(--muted);max-width:70ch}
.band{background:var(--teal);color:var(--on-teal);border-radius:22px;padding:40px 24px;text-align:center;display:grid;gap:16px;justify-items:center;margin-block:24px 56px}
.band h2{font-family:var(--font-display);font-size:clamp(1.75rem,4vw,2.5rem);color:var(--on-teal);text-wrap:balance}
.band .btn.primary{background:var(--on-teal);color:var(--teal);border-color:var(--on-teal)}
.price{border:2px dashed var(--gold);background:var(--gold-2);border-radius:18px;padding:24px;color:var(--ink)}
footer.ft{background:var(--surface);border-top:1px solid var(--line);padding-block:40px 24px}
.ft .cols{display:grid;gap:24px;margin-bottom:24px}
@media(min-width:820px){.ft .cols{grid-template-columns:1.4fr 1fr 1fr 1fr}}
.ft h4{margin:0 0 8px;font-size:1rem}
.ft a{display:block;padding-block:4px;color:var(--muted);text-decoration:none;cursor:pointer}
.ft a:hover{color:var(--teal)}
.draft{background:var(--gold-2);border:1px solid var(--gold);color:var(--ink);border-radius:12px;padding:12px 16px;margin-bottom:24px}
/* auth */
.authwrap{min-height:calc(100vh - 140px);display:grid;place-items:center;padding-block:32px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}
.authcard{width:100%;max-width:440px;border-radius:22px;padding:28px;display:grid;gap:16px}
.authcard h1{font-size:1.75rem;line-height:1.3;font-family:var(--font-display)}
.fld{display:grid;gap:4px}
.fld label{font-weight:600;font-size:.9rem}
.in{width:100%;min-height:44px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px}
textarea.in{min-height:120px;resize:vertical}
.help{font-size:.875rem;color:var(--muted)}
.err{font-size:.875rem;color:var(--rose);display:flex;gap:6px;align-items:center}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.chk input{width:20px;height:20px;margin-top:3px;accent-color:var(--teal);flex:none}
.meter{height:6px;border-radius:6px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;width:0;background:var(--rose);transition:width .2s}
/* app shell */
.shell{display:block}
.side{display:none}
.tabs{position:fixed;inset-inline:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{background:none;border:0;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.72rem;color:var(--muted);cursor:pointer;padding:4px 2px}
.tabs button[aria-current=page]{color:var(--teal);font-weight:700}
.main{padding-block:20px 96px;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.topbar h1{font-size:1.75rem;line-height:1.3;font-family:var(--font-display);margin-inline-end:auto}
@media(min-width:900px){
  .shell{display:grid;grid-template-columns:240px 1fr;gap:32px;align-items:start}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:80px;height:calc(100vh - 100px);padding-block:8px}
  .side button.nav-i{display:flex;gap:12px;align-items:center;min-height:44px;padding:8px 12px;border-radius:10px;border:0;background:none;cursor:pointer;font-weight:500;text-align:start;color:var(--ink);width:100%}
  .side button.nav-i:hover{background:var(--teal-2)}
  .side button.nav-i[aria-current=page]{background:var(--teal);color:var(--on-teal)}
  .tabs{display:none}.main{padding-bottom:56px}
}
.badge{display:inline-flex;gap:4px;align-items:center;border-radius:999px;padding:1px 10px;font-size:.78rem;font-weight:600;line-height:1.6}
.b-trial,.b-up{background:var(--rose-2);color:var(--rose)}.b-soon{background:var(--gold-2);color:var(--gold)}
.b-low{background:var(--teal-2);color:var(--teal)}.b-src{background:var(--green-2);color:var(--green)}
.grid2{display:grid;gap:16px}@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr}}
.grid3{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.alert{display:flex;gap:12px;align-items:flex-start;padding-block:10px;border-bottom:1px solid var(--line)}
.alert:last-child{border:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:9px;flex:none}
.d-rose{background:var(--rose)}.d-gold{background:var(--gold)}.d-teal{background:var(--teal)}
.h2{font-size:1.3rem;line-height:1.35;margin-bottom:12px;font-family:var(--font-display)}
.sub-card{display:grid;gap:12px}

.sc-top{display:flex;gap:12px;align-items:center}
.logo-t{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--font-display);flex:none;font-size:1.1rem}
:root[data-theme=dark] .logo-t,:root:not([data-theme=light]) .logo-t{color:#0F1B1E}
.sc-amt{font-family:var(--font-display);font-size:1.5rem;margin-inline-start:auto;font-weight:700}
.sc-name{font-weight:700;display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:40px;padding:4px 16px;cursor:pointer;font-weight:500}
.chip[aria-pressed=true]{background:var(--teal);color:var(--on-teal);border-color:var(--teal)}
.review{border:2px dashed var(--gold);background:var(--gold-2);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0}
.review dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px 16px;margin:0}
.review dt{font-size:.78rem;color:var(--muted)}.review dd{margin:0;font-weight:600}
.ev{font-size:.85rem;color:var(--muted);border-inline-start:3px solid var(--gold);padding-inline-start:10px}
.bar{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;padding-block:4px;font-size:.9rem}
.bar .trk{background:var(--teal-2);height:12px;border-radius:12px;overflow:hidden}.bar .trk i{display:block;height:100%;border-radius:12px}
.chat{display:grid;grid-template-rows:1fr auto;gap:12px;min-height:60vh}
.msgs{display:flex;flex-direction:column;gap:10px;max-height:56vh;overflow-y:auto;padding:4px}
.bub{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap}
.bub.u{background:var(--teal);color:var(--on-teal);align-self:flex-start}
.bub.a{background:var(--bg);border:1px solid var(--line);align-self:flex-end}
.sugg{display:flex;gap:8px;flex-wrap:wrap}
.cform{display:flex;gap:8px}.cform .in{flex:1}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:0 12px;height:44px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--surface);font-size:.875rem;color:var(--muted)}
td.n,th.n{font-variant-numeric:tabular-nums;text-align:end}
.toast{position:fixed;bottom:88px;inset-inline:0;margin-inline:auto;width:max-content;max-width:90vw;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:50;box-shadow:var(--shadow)}
@media(min-width:900px){.toast{bottom:32px}}
.skel{height:14px;border-radius:8px;background:linear-gradient(90deg,var(--line),var(--teal-2),var(--line));background-size:200% 100%}
@media(prefers-reduced-motion:no-preference){.skel{animation:sh 1.2s linear infinite}@keyframes sh{to{background-position:-200% 0}}}
.empty{text-align:center;padding:40px 16px;display:grid;gap:12px;justify-items:center}
.sw{position:relative;width:46px;height:26px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:26px;background:var(--line);pointer-events:none;transition:.15s}
.sw i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:var(--surface)}
.sw input:checked+i{background:var(--teal)}.sw input:checked+i::after{inset-inline-start:23px}
.sw input:focus-visible+i{outline:3px solid var(--gold);outline-offset:2px}
.src{display:flex;gap:12px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line)}
.src:last-child{border:0}.src>div{flex:1;min-width:0}
.proto{background:var(--gold-2);border-bottom:1px solid var(--gold);padding:6px 16px;text-align:center;font-size:.85rem;color:var(--ink)}
.adminbar{border-top:3px solid var(--gold)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi b{display:block;font-family:var(--font-display);font-size:1.75rem;line-height:1.2}
pre.csv{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto;direction:ltr;text-align:left;font-size:.85rem;margin:12px 0 0}
</style>

/* ---------- agent: redact + extract ---------- */
const AR_DIG="٠١٢٣٤٥٦٧٨٩";
const normDigits=s=>s.replace(/[٠-٩]/g,d=>AR_DIG.indexOf(d)).replace(/٫/g,".").replace(/٬/g,",");
function redact(raw){let s=normDigits(raw);
 s=s.replace(/\b(?:\d[ -]?){13,19}\b/g,m=>{const d=m.replace(/\D/g,"");return d.length>=13?`[CARD ••${d.slice(-4)}]`:m});
 s=s.replace(/\bOM\d{2}[A-Z0-9 ]{10,30}\b/g,"[ACCOUNT]");
 s=s.replace(/(OTP|رمز|code|كود)([^\d]{0,15})(\d{4,8})/gi,"$1$2[OTP]");
 s=s.replace(/[\w.+-]+@[\w-]+\.[\w.]+/g,"[EMAIL]");
 s=s.replace(/(\+?968[ -]?)?\b[79]\d{7}\b/g,"[PHONE]");return s}
function extract(raw){
 const text=redact(raw),low=text.toLowerCase();
 const bill=/(charged|payment|receipt|renew|subscription|trial|invoice|billed|مدين|خصم|سحب|تجديد|اشتراك|فاتورة|دفع|تجريبي|عملية)/i.test(text);
 const al=ALIASES.find(a=>low.includes(a[0]));
 const am=text.match(/(?:OMR|RO|ر\.?\s?ع\.?|USD|SAR|AED|\$)\s*([\d,]+(?:\.\d+)?)|([\d,]+(?:\.\d+)?)\s*(OMR|RO|ر\.?\s?ع\.?|USD|SAR|AED|\$)/i);
 let amt=null,cur=null,ev=[];
 if(am){const v=parseFloat((am[1]||am[2]).replace(/,/g,""));const c=(am[0].match(/OMR|RO|ر|USD|SAR|AED|\$/i)||[""])[0].toUpperCase();cur=c==="$"||c==="USD"?"USD":c==="SAR"?"SAR":c==="AED"?"AED":"OMR";if(v>0&&v<10000){amt=v;ev.push(am[0].trim())}}
 const cyc=/(yearly|annual|سنوي|سنة)/i.test(text)?"y":/(monthly|month|شهري|شهر)/i.test(text)?"m":null;
 const cm=text.match(/(?:ending|••|\*{2,}|بطاقة[^\d]{0,10})\s*(\d{4})/i);
 const trial=/(trial|تجريب)/i.test(text);
 let conf=0;if(bill)conf+=.1;if(al)conf+=.45;if(amt!=null)conf+=.3;if(cyc)conf+=.1;if(cm)conf+=.05;
 if(al)ev.push(al[0]);
 if(!bill||(!al&&amt==null))return{ok:false,text};
 const usd=cur&&cur!=="OMR"?amt:null;
 const omr=amt==null?null:+(amt*(FX[cur]||1)).toFixed(3);
 const known=!!al;
 const rule=conf>=.85&&known?"confidence ≥ 0.85 and merchant known → auto-apply":conf>=.5?"0.5 ≤ confidence < 0.85 → review queue":"confidence < 0.5 → discard";
 return{ok:true,text,merchant:al?al[1]:"?",known,cat:al?al[2]:"other",amt:omr,cur:cur||"OMR",usd,cycle:cyc||"m",card:cm?cm[1]:null,trial,conf:Math.min(conf,.99),rule,ev};}

/* ---------- assistant (rule-based over user's own data) ---------- */
function answer(q){
 const x=normDigits(q).toLowerCase(),ar=lang()==="ar";
 const L=live();
 if(/(salary|payday|راتب)/.test(x)){const u=untilSalary(),tot=u.reduce((a,s)=>a+s.amt,0);
  if(!u.length)return ar?"ما في شي بينسحب قبل الراتب.":"Nothing is charged before payday.";
  return ar?`قبل الراتب (${fmtDate(salaryDate())}) بينسحب ${moneyTxt(tot)} من ${dnum(u.length)} اشتراكات: ${u.slice(0,4).map(s=>`${s.name} (${fmtDate(s.next)})`).join("، ")}${u.length>4?"…":""}.`:`Before payday (${fmtDate(salaryDate())}) ${moneyTxt(tot)} is charged across ${u.length} subscriptions: ${u.slice(0,4).map(s=>`${s.name} (${fmtDate(s.next)})`).join(", ")}${u.length>4?"…":""}.`}
 if(/(week|أسبوع|اسبوع|يتجدد|بيتجدد|renew)/.test(x)){const u=L.filter(s=>diff(parse(s.next))<=7).sort((a,b)=>a.next<b.next?-1:1);
  if(!u.length)return ar?"ما في شي بيتجدد هالأسبوع.":"Nothing renews this week.";
  return ar?`${dnum(u.length)} بيتجددون هالأسبوع: ${u.map(s=>`${s.name} ${rel(s.next)} (${moneyTxt(s.amt)}${s.status==="trial"?"، وهو تجريبي":""})`).join("، ")}.\nتبي${addrF("ن","")} أذكر${addrF("ش","ك")} قبل ${u.find(s=>s.status==="trial")?.name||u[0].name} الليلة؟`:`${u.length} renew this week: ${u.map(s=>`${s.name} ${rel(s.next)} (${moneyTxt(s.amt)}${s.status==="trial"?", trial":""})`).join(", ")}.\nWant a reminder tonight?`}
 if(/(month|شهر|بالشهر|أدفع|ادفع|pay|total|مجموع)/.test(x)){const m=monthlyTotal(),big=[...L].sort((a,b)=>b.amt-a.amt)[0];
  if(!big)return t("none");
  return ar?`مجموع اشتراكات${addrF("ش","ك")} النشطة ${moneyTxt(m)} بالشهر، يعني تقريباً ${dnum(Math.round(m*12))} ر.ع بالسنة. أكبرها ${big.name} بـ ${moneyTxt(big.amt)}.`:`Your active subscriptions total ${moneyTxt(m)} per month, about OMR ${Math.round(m*12)} per year. The biggest is ${big.name} at ${moneyTxt(big.amt)}.`}
 if(/(similar|duplicate|متشابه|مكرر|نفس)/.test(x)){const g={};L.forEach(s=>(g[s.cat]=g[s.cat]||[]).push(s));
  const d=Object.entries(g).filter(([c,a])=>(c==="music"&&a.length>=2)||(c==="streaming"&&a.length>=3)||(c==="cloud_storage"&&a.length>=2));
  if(!d.length)return ar?"ما لقيت اشتراكات مكررة.":"I found no duplicate subscriptions.";
  return d.map(([c,a])=>ar?`عندك ${dnum(a.length)} في ${CAT.ar[c]}: ${a.map(s=>s.name).join("، ")}. يمكن تستغني${addrF("ن","")} عن واحد منها.`:`You have ${a.length} in ${CAT.en[c]}: ${a.map(s=>s.name).join(", ")}. You may not need all of them.`).join("\n")}
 if(/(cancel|الغ|ألغ|إلغاء)/.test(x)){const s=L.find(s=>x.includes(s.name.toLowerCase()));if(s&&GUIDE[s.name])return GUIDE[s.name][lang()];return ar?"قول لي اسم الاشتراك وأعطيك خطوات الإلغاء. أنا ما ألغي عنك، بس أدلك.":"Tell me which subscription and I'll give you the steps. I don't cancel for you, I only guide."}
 const s=L.find(s=>x.includes(s.name.toLowerCase()));
 if(s)return ar?`${s.name}: ${moneyTxt(s.amt)} ${s.cycle==="y"?"بالسنة":"بالشهر"}، يتجدد ${rel(s.next)} (${fmtDate(s.next)})${s.card?`، على بطاقة ••${s.card}`:""}.`:`${s.name}: ${moneyTxt(s.amt)} ${s.cycle==="y"?"per year":"per month"}, renews ${rel(s.next)} (${fmtDate(s.next)})${s.card?`, card ••${s.card}`:""}.`;
 return t("oos")}

 const tabs=[["dashboard","home"],["wallet","wallet"],["add","plus"],["assistant","chat"],["more","more"]];
 const moreOpen=sub==="more";
 return `${header()}<div class="wrap shell ${adm?"adminbar":""}"><nav class="side" aria-label="app">${NAVS.map(([k,i])=>`<button class="nav-i" data-act="goto" data-k="${k}" ${!adm&&sub===k?'aria-current="page"':""}>${ic(i)}${t(k)}${k==="review"&&S.finds.length?` <span class="badge b-soon">${dnum(S.finds.length)}</span>`:""}</button>`).join("")}${isAdmin()?`<button class="nav-i" data-act="admin" ${adm?'aria-current="page"':""} style="margin-top:auto">${ic("admin")}${t("admin")}</button>`:""}<button class="nav-i" data-act="logout">${ic("out","flip")}${t("logout")}</button></nav>
 <main class="main"><div class="topbar"><h1>${adm?t("adminT"):t(sub==="more"?"more":sub)}</h1>${adm?`<span class="badge b-soon">${t("admin")}</span>`:`<button class="btn sm" data-act="goto" data-k="add">${ic("plus")}${t("add")}</button>`}</div>
 ${adm?vAdmin():sub==="more"?`<div class="card" style="display:grid;gap:4px">${["review","reports","sources","settings"].map(k=>`<button class="btn" style="justify-content:flex-start" data-act="goto" data-k="${k}">${t(k)}</button>`).join("")}${isAdmin()?`<button class="btn" style="justify-content:flex-start" data-act="admin">${t("admin")}</button>`:""}<button class="btn" style="justify-content:flex-start" data-act="logout">${t("logout")}</button></div>`:VIEWS[sub]()}</main></div>
 <nav class="tabs" aria-label="tabs">${tabs.map(([k,i])=>`<button data-act="goto" data-k="${k}" ${(sub===k||(k==="more"&&["review","reports","sources","settings"].includes(sub)))&&!adm?'aria-current="page"':""}>${ic(i)}<span>${t(k)}</span></button>`).join("")}</nav>`}

/* ---------- render & events ---------- */
function render(){
 const L=lang();document.documentElement.lang=L;document.documentElement.dir=L==="ar"?"rtl":"ltr";document.body.setAttribute("lang",L);
 let h="";const banner=`<div class="proto">${t("proto")}</div>`;
 if(ST.route==="home")h=home();else if(ST.route==="login")h=auth();else if(ST.route==="legal")h=legal(ST.legalK);else h=appShell();
 const fx=document.activeElement&&document.activeElement.id;
 $("#root").innerHTML=banner+h;
 if(fx){const e=document.getElementById(fx);if(e&&e.focus){try{e.focus()}catch(_){}}}
 onScroll();
 const m=$("#msgs");if(m)m.scrollTop=m.scrollHeight;
 const pw=$("#a-pass"),mt=$("#meter");if(pw&&mt)pw.addEventListener("input",()=>{const v=pw.value;let sc=Math.min(v.length/14,1)*60+(/[A-Z]/.test(v)?10:0)+(/\d/.test(v)?15:0)+(/[^\w]/.test(v)?15:0);mt.style.width=sc+"%";mt.style.background=sc<50?"var(--rose)":sc<80?"var(--gold)":"var(--green)"});
}
function onScroll(){const h=$("#hdr");if(h)h.classList.toggle("scrolled",scrollY>4)}
addEventListener("scroll",onScroll,{passive:true});
function go(route,sub){ST.route=route;if(sub)ST.sub=sub;ST.menu=false;render();scrollTo(0,0);try{history.replaceState(null,"","#"+(route==="app"?"app-"+ST.sub:route))}catch(e){}}
function addSub(o){S.subs.push({id:S.nid++,name:o.name,cat:o.cat||"other",amt:o.amt,cur:o.cur||"OMR",usd:o.usd,cycle:o.cycle||"m",next:o.next,status:o.trial?"trial":"active",card:o.card||null,src:o.src||"manual",conf:o.conf||1,prev:null,used:null});save()}
function nextFrom(dateIso,cycle){let d=parse(dateIso),g=0;while(diff(d)<0&&g++<48)d=cycle==="y"?new Date(d.getFullYear()+1,d.getMonth(),d.getDate()):new Date(d.getFullYear(),d.getMonth()+1,Math.min(d.getDate(),28));return iso(d)}
document.addEventListener("click",e=>{
 const g=e.target.closest("[data-go]");if(g){e.preventDefault();ST.menu=false;if(ST.route!=="home"){ST.route="home";render()}else render();setTimeout(()=>{const el=document.getElementById(g.dataset.go);if(el)el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})},0);return}
 const a=e.target.closest("[data-act]");if(!a)return;const act=a.dataset.act,id=+a.dataset.id,k=a.dataset.k;if(a.tagName==="A")e.preventDefault();
 const F=()=>S.finds.find(f=>f.id===id),SUB=()=>S.subs.find(s=>s.id===id);
 switch(act){
  case"home":go("home");break;
  case"lang":S.settings.lang=lang()==="ar"?"en":"ar";save();render();break;
  case"theme":{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark";break}
  case"menu":ST.menu=!ST.menu;render();break;
  case"login":ST.authMode="login";go("login");break;
  case"signup":ST.authMode="signup";go("login");break;
  case"showpass":{const p=$("#a-pass");p.type=p.type==="password"?"text":"password";a.textContent=p.type==="password"?t("show"):t("hide");break}
  case"legal":ST.legalK=k;go("legal");break;
  case"logout":api("POST","/logout").finally(()=>{ST.user=null;const l=S.settings.lang;S=fresh();S.settings.lang=l;go("home");toast(t("loggedOut"))});break;
  case"export":api("GET","/export").then(r=>{const u=URL.createObjectURL(new Blob([JSON.stringify(r.data,null,2)],{type:"application/json"}));const x=document.createElement("a");x.href=u;x.download="hasba-export.json";document.body.appendChild(x);x.click();x.remove()});break;
  case"delask":ST.delAsk=true;render();break;
  case"delgo":api("DELETE","/account",{password:$("#del-pass").value}).then(r=>{if(!r.ok)return toast(t("errLogin"));ST.user=null;ST.delAsk=false;S=fresh();go("home");toast(t("delGone"))});break;
  case"goto":ST.route="app";ST.sub=k;render();scrollTo(0,0);try{history.replaceState(null,"","#app-"+k)}catch(_){}break;
  case"admin":if(!isAdmin())break;ST.route="admin";render();scrollTo(0,0);break;
  case"filter":ST.filter=k;render();break;
  case"used":SUB().used=iso(TODAY);save();render();toast("✓");break;
  case"cancelsub":{const s=SUB();s.status="cancelled";save();render();toast(`${s.name} — ${t("cancelled")}`);break}
  case"restore":SUB().status="active";save();render();break;
  case"approve":{const f=F();if(ST.editing===f.id){const v=parseFloat($("#ed-amt").value);if(v>0)f.amt=v}
   addSub({name:f.merchant,cat:f.cat,amt:f.amt,cur:f.cur,usd:f.usd,cycle:f.cycle,next:nextFrom(iso(addDays(parse(f.date),f.cycle==="y"?365:30)),f.cycle),src:"email",conf:f.conf});
   S.finds=S.finds.filter(x=>x.id!==id);ST.editing=null;save();render();toast(t("approve")+" ✓");break}
  case"editf":ST.editing=id;render();break;
  case"reject":S.finds=S.finds.filter(x=>x.id!==id);save();render();break;
  case"sample":$("#paste").value=lang()==="ar"?SAMPLE_AR:SAMPLE_EN;break;
  case"ask":sendQ(a.dataset.q);break;
  case"copycsv":{const txt=$("#csvtxt").textContent;const done=()=>toast(t("copied"));if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,()=>{const r=document.createRange();r.selectNodeContents($("#csvtxt"));const s=getSelection();s.removeAllRanges();s.addRange(r)});else{const r=document.createRange();r.selectNodeContents($("#csvtxt"));const s=getSelection();s.removeAllRanges();s.addRange(r)}break}
  case"src":S.consent[k]=S.consent[k].on?{on:false}:{on:true,since:iso(TODAY)};save();render();break;
  case"resetdata":{const l=S.settings;S={subs:seed(),finds:seedFindings(),nid:200,settings:l,consent:S.consent};save();render();toast(t("saved"));break}
 }});
function sendQ(q){q=q.trim();if(!q)return;ST.chat.push({r:"u",t:q});render();
 const m=$("#msgs");m.insertAdjacentHTML("beforeend",`<div class="bub a" id="think">${t("thinking")}</div>`);m.scrollTop=m.scrollHeight;
 setTimeout(()=>{ST.chat.push({r:"a",t:answer(q)});render()},450)}
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target.id;
 if(f==="authf"){const em=$("#a-email").value.trim(),pw=$("#a-pass").value,er=$("#a-err");const su=ST.authMode==="signup";
  const bad=m=>{er.innerHTML=ic("alert")+m;er.hidden=false;return};
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return bad(t("errEmail"));
  if(su&&pw.length<10)return bad(t("errPass"));
  if(su&&!(["a-c1","a-c2","a-c3"].every(i=>$("#"+i).checked)))return bad(t("errConsent"));
  const btn=e.target.querySelector('button[type=submit]');btn.disabled=true;
  api("POST",su?"/signup":"/login",su?{name:$("#a-name").value.trim(),email:em,phone:$("#a-phone").value.trim(),password:pw,consents:["privacy","data","ai"],state:S}:{email:em,password:pw}).then(r=>{btn.disabled=false;
   if(!r.ok)return bad(r.status===429?t("errWait"):r.status===409?t("errExists"):r.status===400&&r.data.error==="password"?t("errPass"):t("errLogin"));
   loadUser(r.data);go("app","dashboard");toast(t("welcome"))}).catch(()=>{btn.disabled=false;bad(t("errNet"))});return}
 if(f==="pasteForm"){const raw=$("#paste").value;if(!raw.trim())return;const r=extract(raw);ST.lastParse=r;
  if(r.ok&&r.conf>=.85&&r.known){const nx=iso(addDays(TODAY,r.cycle==="y"?365:30));addSub({name:r.merchant,cat:r.cat,amt:r.amt,cur:r.cur,usd:r.usd,cycle:r.cycle,next:nx,card:r.card,src:"sms",conf:r.conf,trial:r.trial})}
  else if(r.ok&&r.conf>=.5){S.finds.push({id:S.nid++,merchant:r.merchant==="?"?"—":r.merchant,amt:r.amt==null?0:r.amt,cur:r.cur,usd:r.usd,cycle:r.cycle,date:iso(TODAY),cat:r.cat,conf:r.conf,rule:r.rule,ev:r.ev});save()}
  render();$("#paste").value=raw}
 if(f==="manualForm"){const n=$("#m-name").value.trim(),a=parseFloat($("#m-amt").value),d=$("#m-date").value;if(!n||!(a>0)||!d)return;
  addSub({name:n,cat:$("#m-cat").value,amt:a,cycle:$("#m-cycle").value,next:d,src:"manual"});go("app","wallet");toast(t("save")+" ✓")}
 if(f==="chatf"){const q=$("#q").value;sendQ(q)}
 if(f==="repf"){ST.rep={from:$("#r-from").value,to:$("#r-to").value};render()}
 if(f==="setf"){const s=S.settings;s.salaryDay=Math.min(28,Math.max(1,parseInt($("#s-sal").value)||18));s.offsets=[...document.querySelectorAll('[name=off]:checked')].map(x=>+x.value).sort((a,b)=>b-a);s.quiet=[$("#s-q1").value,$("#s-q2").value];s.lang=$("#s-lang").value;s.addr=$("#s-addr").value;s.digits=$("#s-dig").value;save();render();toast(t("saved"))}
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches('[role=link][data-act]')){e.preventDefault();e.target.click()}});
const h0=(location.hash||"").replace("#","");
if(h0.startsWith("app-")&&VIEWS[h0.slice(4)]){ST.route="app";ST.sub=h0.slice(4)}else if(h0==="login"||h0==="signup"){ST.route="login";ST.authMode=h0}
function loadUser(d){ST.user=d.user;if(d.state&&d.state.subs){const l=S.settings.lang;S=d.state;if(!S.settings.lang)S.settings.lang=l;roll()}}
render();
api("GET","/me").then(r=>{if(r.ok&&r.data.user){loadUser(r.data);if(ST.route==="home"||ST.route==="login"){ST.route="app";ST.sub=VIEWS[h0.slice(4)]?h0.slice(4):"dashboard"}render()}}).catch(()=>{});
</script>
